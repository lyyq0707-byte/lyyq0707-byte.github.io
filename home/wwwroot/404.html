<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Lost in space</title>
  <meta name="description" content="Page not found.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <!-- 404 页面会出现在任意路径下，所以资源必须用以 / 开头的绝对路径 -->
  <link rel="stylesheet" href="/css/404.css">
  <script>
    (function () {
      var lang = 'en';
      try {
        var saved = localStorage.getItem('lang');
        if (saved === 'zh' || saved === 'en') lang = saved;
      } catch (e) {}
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    })();
  </script>
</head>
<body>
  <!-- 背景：极光光晕 + 星空（canvas） -->
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <canvas id="stars" aria-hidden="true"></canvas>

  <header class="top">
    <span class="badge"><span class="dot"></span>ERROR 404</span>
    <button class="lang-btn" id="langToggle" type="button" aria-label="Switch language / 切换语言">
      <span lang="en">中文</span><span lang="zh-CN">EN</span>
    </button>
  </header>

  <main class="stage">
    <!-- 粒子组成的 404，可与鼠标/手指互动 -->
    <canvas id="particles" role="img" aria-label="404"></canvas>

    <div class="copy">
      <h1 class="glitch" data-text-en="Lost in space" data-text-zh="迷失在太空中">
        <span lang="en">Lost in space</span><span lang="zh-CN">迷失在太空中</span>
      </h1>
      <p class="sub" lang="en">The page you're looking for drifted off into the void — or never existed at all.</p>
      <p class="sub" lang="zh-CN">你要找的页面已经飘进了宇宙深处 —— 或者它根本就不存在。</p>

      <p class="hint" lang="en"><span class="key">Move</span> to push the stars · <span class="key">Click</span> to make it explode</p>
      <p class="hint" lang="zh-CN"><span class="key">移动</span>推开星尘 · <span class="key">点击</span>让它爆炸</p>

      <div class="actions">
        <button class="btn btn-primary" id="backBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          <span lang="en">Go back</span><span lang="zh-CN">返回上一页</span>
        </button>
        <button class="btn btn-ghost" id="gameBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>
          <span lang="en">Find the lost page</span><span lang="zh-CN">找回丢失的页面</span>
        </button>
      </div>
    </div>
  </main>

  <!-- 小游戏：会躲开鼠标的“丢失的页面” -->
  <button class="lost-page" id="lostPage" type="button" aria-label="Catch the lost page" hidden>
    <svg viewBox="0 0 48 60" aria-hidden="true">
      <path class="paper" d="M4 2h28l12 12v42a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
      <path class="fold" d="M32 2v12h12"/>
      <circle class="eye" cx="16" cy="30" r="2.6"/>
      <circle class="eye" cx="30" cy="30" r="2.6"/>
      <path class="mouth" d="M17 41q6 -5 12 0"/>
    </svg>
  </button>

  <div class="scoreboard" id="scoreboard" hidden>
    <span lang="en">Caught</span><span lang="zh-CN">已抓到</span>
    <strong id="score">0</strong>/5
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="/js/404.js"></script>
</body>
</html>
